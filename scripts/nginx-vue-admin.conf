# HTTPS — domain
server {
    listen 443 ssl;
    server_name tjb666.space www.tjb666.space;
    root /var/www/vue-admin;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tjb666.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tjb666.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/englishStudy.conf;
    include /etc/nginx/snippets/reminder-api.conf;
    include /etc/nginx/snippets/appdemo-api.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTP — domain → HTTPS
server {
    listen 80;
    server_name tjb666.space www.tjb666.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vue-admin;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP — bare IP（兼容旧 APK 更新地址）
server {
    listen 80 default_server;
    server_name 134.175.54.151 _;
    root /var/www/vue-admin;
    index index.html;

    include /etc/nginx/snippets/englishStudy.conf;
    include /etc/nginx/snippets/reminder-api.conf;
    include /etc/nginx/snippets/appdemo-api.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
