# 片段：把下列 location 并入 /etc/nginx/snippets/appdemo-api.conf
# 目的：禁止 nginx 缓冲 SSE，否则前端会等齐后「突然一大坨」。
# 用法：nginx -t && systemctl reload nginx（不要为此重启本机 H2 后端）

location /api/v1/me/explore/chat/stream {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Device-Id $http_x_device_id;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header X-Accel-Buffering no always;
    add_header Cache-Control "no-cache, no-transform" always;
}
